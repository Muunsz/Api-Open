name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            asset_name: Api-Open-Electron-Windows.exe
          - os: macos-latest
            platform: mac
            asset_name: Api-Open-Electron-macOS.dmg
          - os: ubuntu-latest
            platform: linux
            asset_name: Api-Open-Electron-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@api-open/shared && npm run build --workspace=@api-open/web
        env:
          VITE_BASE_PATH: './'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build Electron installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          npm install --no-workspaces --no-audit --no-fund
          npx electron-builder --${{ matrix.platform }} --publish never
      - name: Collect Electron artifact
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "win" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.exe" | head -n 1)
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -n 1)
          else
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.AppImage" | head -n 1)
          fi
          cp "$FILE" "release-assets/${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset_name }}

  publish-release:
    needs: [build-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" all-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" all-assets/* --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes
          fi
