name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            asset_name: Api-Open-Electron-Windows.exe
          - os: macos-latest
            platform: mac
            asset_name: Api-Open-Electron-macOS.dmg
          - os: ubuntu-latest
            platform: linux
            asset_name: Api-Open-Electron-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@api-open/shared && npm run build --workspace=@api-open/web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build Electron installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-workspaces --no-audit --no-fund
          npx electron-builder --${{ matrix.platform }} --publish never
      - name: Collect Electron artifact
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "win" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.exe" | head -n 1)
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -n 1)
          else
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.AppImage" | head -n 1)
          fi
          cp "$FILE" "release-assets/${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset_name }}

  build-csharp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish C# WPF executable
        working-directory: apps/desktop-csharp
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Stage C# artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp apps/desktop-csharp/publish/ApiOpen.Desktop.exe release-assets/Api-Open-CSharp-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: csharp-win
          path: release-assets/Api-Open-CSharp-Windows.exe

  build-cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download WebView2 SDK
        working-directory: apps/desktop-cpp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" -OutFile "packages/webview2.zip"
          Expand-Archive -Path "packages/webview2.zip" -DestinationPath "packages/webview2" -Force
      - name: Configure & Build C++ Win32
        working-directory: apps/desktop-cpp
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWEBVIEW2_DIR="${{ github.workspace }}/apps/desktop-cpp/packages/webview2"
          cmake --build build --config Release
      - name: Stage C++ artifact
        shell: bash
        run: |
          mkdir -p release-assets
          EXE=$(find apps/desktop-cpp/build -name "ApiOpenDesktop.exe" | head -n 1)
          cp "$EXE" release-assets/Api-Open-Cpp-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-win
          path: release-assets/Api-Open-Cpp-Windows.exe

  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Build Java package
        working-directory: apps/desktop-java
        run: mvn -B package -DskipTests
      - name: Stage Java artifact
        shell: bash
        run: |
          mkdir -p release-assets
          JAR=$(find apps/desktop-java/target -maxdepth 1 -name "*.jar" ! -name "original-*" | head -n 1)
          cp "$JAR" release-assets/Api-Open-Java.jar
      - uses: actions/upload-artifact@v7
        with:
          name: java-jar
          path: release-assets/Api-Open-Java.jar

  publish-release:
    needs: [build-electron, build-csharp, build-cpp, build-java]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" all-assets/* --clobber
          else
            gh release create "$TAG" all-assets/* --title "$TAG" --generate-notes
          fi
