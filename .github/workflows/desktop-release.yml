name: Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, auto-bumps patch if empty)'
        required: false
        default: ''

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_REL=$(gh release view --repo "$REPO" --json tagName -q '.tagName' 2>/dev/null || echo "")
          LATEST_GIT=$(git ls-remote --tags --refs "https://github.com/${REPO}.git" "refs/tags/v*" 2>/dev/null | awk -F'/' '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || echo "")
          LATEST=$(printf '%s\n%s\n' "$LATEST_REL" "$LATEST_GIT" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ -n "$LATEST" ]; then
            CLEAN="${LATEST#v}"
            MAJOR=$(echo "$CLEAN" | cut -d. -f1)
            MINOR=$(echo "$CLEAN" | cut -d. -f2)
            PATCH=$(echo "$CLEAN" | cut -d. -f3)
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            NEXT_TAG="v1.3.7"
          fi
          echo "Auto-resolved release tag: $NEXT_TAG (previous: ${LATEST:-none})"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

  build-electron:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            asset_name: Api-Open-Electron-Windows.exe
          - os: macos-latest
            platform: mac
            asset_name: Api-Open-Electron-macOS.dmg
          - os: ubuntu-latest
            platform: linux
            asset_name: Api-Open-Electron-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@api-open/shared && npm run build --workspace=@api-open/web
        env:
          VITE_BASE_PATH: './'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build Electron installer
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          npm install --no-workspaces --no-audit --no-fund
          npx electron-builder --${{ matrix.platform }} --publish never
      - name: Collect Electron artifact
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "win" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.exe" | head -n 1)
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.dmg" | head -n 1)
          else
            FILE=$(find apps/desktop/dist -maxdepth 1 -name "*.AppImage" | head -n 1)
          fi
          cp "$FILE" "release-assets/${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset_name }}

  publish-release:
    needs: [prepare, build-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" all-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" all-assets/* --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes
          fi
